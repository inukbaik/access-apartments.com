[mypy]
python_version = 3.11
files = finder
check_untyped_defs = True
warn_unused_ignores = True
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-finder.schemas]
disallow_untyped_defs = True

[mypy-finder.data_quality]
disallow_untyped_defs = True

[mypy-usaddress.*]
ignore_missing_imports = True

[mypy-mp_common]
ignore_missing_imports = True
